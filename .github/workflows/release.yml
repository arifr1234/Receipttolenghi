name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Build Release APK
        env:
          GOOGLE_FONTS_API_KEY: ${{ secrets.GOOGLE_FONTS_API_KEY }}
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/receipttolenghi-${{ github.ref_name }}.apk
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/receipttolenghi.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/receipttolenghi-${{ github.ref_name }}.apk
            release-artifacts/receipttolenghi.apk
          generate_release_notes: true
          body: |
            ### 📥 Quick Download
            * **[Download Latest APK (receipttolenghi.apk)](https://github.com/${{ github.repository }}/releases/latest/download/receipttolenghi.apk)**
            * **[Download Versioned APK (${{ github.ref_name }})](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/receipttolenghi-${{ github.ref_name }}.apk)**
